spring.application.name=api-gateway
server.port=8080

management.endpoints.web.exposure.include=health,info

# JWT
security.jwt.keystore-location=${JWT_KEYSTORE_LOCATION}
security.jwt.keystore-password=${JWT_KEYSTORE_PASSWORD}
security.jwt.key-alias=${JWT_KEY_ALIAS:gateway-jwt}
security.jwt.token-ttl=${JWT_TOKEN_TTL:5m}

security.jwt.validation.issuer=${JWT_ISSUER:api-gateway}

# Gateway services
gateway.services.file-processing=${FILE_PROCESSING_SERVICE_URL:http://localhost:8081}
gateway.services.metadata=${METADATA_SERVICE_URL:http://localhost:8082}

# Logging
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [correlationId=%X{correlationId:-}] - %msg%n
logging.level.root=INFO
logging.level.dev.arunsamra.apigateway=DEBUG
logging.level.dev.arunsamra.common.web.logging=DEBUG