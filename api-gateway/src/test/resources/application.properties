spring.application.name=api-gateway
server.port=8080

# Gateway services
gateway.services.file-processing=http://localhost:8081
gateway.services.metadata=http://localhost:8082

# JWT
security.jwt.keystore-location=classpath:keys/gateway-jwt-test.p12
security.jwt.keystore-password=changeit
security.jwt.key-alias=gateway-jwt
security.jwt.token-ttl=5m

security.jwt.validation.issuer=${JWT_ISSUER:api-gateway}