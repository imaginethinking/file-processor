info:
  name: Get Metadata
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/v1/files/:fileName/metadata"
  params:
    - name: fileName
      value: happy_path_processed.zip
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
