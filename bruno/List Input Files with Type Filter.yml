info:
  name: List Input Files with Type Filter
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/files?fileType=JPEG"
  params:
    - name: fileType
      value: JPEG
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
