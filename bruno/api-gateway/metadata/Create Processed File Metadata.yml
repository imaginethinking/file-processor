info:
  name: Create Processed File Metadata
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/metadata/processed-files"
  body:
    type: json
    data: |-
      {
        "originalFilename":"test.zip",
        "files":[
          {
            "name":"document.pdf",
            "type":"PDF",
            "size":1024
          },
          {
            "name":"image.jpeg",
            "type":"JPEG",
            "size":5120
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
