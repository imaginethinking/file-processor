spring.application.name=file-processing-service
server.port=8081

# Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,retries,retryevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# File processing paths
file-processor.input-directory=${FILE_PROCESSOR_INPUT_DIR:./file-processing/input}
file-processor.processed-directory=${FILE_PROCESSOR_PROCESSED_DIR:./file-processing/processed}
file-processor.encoded-directory=${FILE_PROCESSOR_ENCODED_DIR:./file-processing/encoded}
file-processor.error-directory=${FILE_PROCESSOR_ERROR_DIR:./file-processing/error}

file-processor.allowed-file-types=${FILE_PROCESSOR_ALLOWED_FILE_TYPES:PDF, JPEG, JPG}

# Logging
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [correlationId=%X{correlationId:-}] - %msg%n
logging.level.root=INFO
logging.level.dev.arunsamra.fileprocessor=DEBUG
logging.level.dev.arunsamra.common.web.logging=DEBUG

# Metadata service client
spring.http.serviceclient.metadata.base-url=${METADATA_SERVICE_URL:http://localhost:8082}
spring.http.serviceclient.metadata.connect-timeout=${METADATA_CONNECT_TIMEOUT:2s}
spring.http.serviceclient.metadata.read-timeout=${METADATA_READ_TIMEOUT:5s}

# Metadata service retry
resilience4j.retry.instances.metadata-service.max-attempts=${METADATA_RETRY_MAX_ATTEMPTS:2}
resilience4j.retry.instances.metadata-service.wait-duration=${METADATA_RETRY_DELAY:200ms}
resilience4j.retry.instances.metadata-service.retry-exceptions=org.springframework.web.client.ResourceAccessException

# Metadata service circuit breaker
resilience4j.circuitbreaker.instances.metadata-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.metadata-service.sliding-window-size=${METADATA_CIRCUIT_BREAKER_WINDOW_SIZE:10}
resilience4j.circuitbreaker.instances.metadata-service.minimum-number-of-calls=${METADATA_CIRCUIT_BREAKER_MINIMUM_CALLS:5}
resilience4j.circuitbreaker.instances.metadata-service.failure-rate-threshold=${METADATA_CIRCUIT_BREAKER_FAILURE_RATE:50}
resilience4j.circuitbreaker.instances.metadata-service.wait-duration-in-open-state=${METADATA_CIRCUIT_BREAKER_OPEN_DURATION:10s}
resilience4j.circuitbreaker.instances.metadata-service.permitted-number-of-calls-in-half-open-state=${METADATA_CIRCUIT_BREAKER_HALF_OPEN_CALLS:3}
resilience4j.circuitbreaker.instances.metadata-service.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.metadata-service.record-exceptions=org.springframework.web.client.RestClientException
resilience4j.circuitbreaker.instances.metadata-service.register-health-indicator=true

# JWT validation
security.jwt.validation.issuer=${JWT_ISSUER:api-gateway}
security.jwt.validation.public-key-location=${JWT_PUBLIC_KEY_LOCATION}