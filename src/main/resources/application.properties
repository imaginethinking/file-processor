spring.application.name=file-processor

# File processing paths
file-processor.input-directory=${FILE_PROCESSOR_INPUT_DIR:./file-processing/input}
file-processor.processed-directory=${FILE_PROCESSOR_PROCESSED_DIR:./file-processing/processed}
file-processor.encoded-directory=${FILE_PROCESSOR_ENCODED_DIR:./file-processing/encoded}
file-processor.error-directory=${FILE_PROCESSOR_ERROR_DIR:./file-processing/error}

file-processor.allowed-file-types=${FILE_PROCESSOR_ALLOWED_FILE_TYPES:PDF, JPEG, JPG}}